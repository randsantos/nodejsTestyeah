<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Search</title>
    <link rel="stylesheet" href="/public/css/mariogame.css" />
    <title>Mario Database Project</title>
  </head>

  <body>
    <div class="bar">
      <img src="baselogo.png" />
    </div>
    <h1 style="text-align: center">Welcome to the Super Mario Database!</h1>
    <p style="text-align: center">
      For school. Relatively barren due to scope not aligning
    </p>
    <h1>Release Search</h1>
    <div class="filters">
      <input id="gameName" placeholder="Title" />
      <input id="gameRelease" placeholder="Release Year" />
      <select id="sort">
        <option value="gameName">Sort by title</option>
        <option value="gameRelease">Sort by year</option>
        <option value="gameDev">Sort by developer</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>

    <p id="status"></p>
    <ul id="results"></ul>
  </body>
</html>
